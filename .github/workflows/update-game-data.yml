# Rebuilds OpenEye's game data (items, tooltips, enemies and their drops) from the latest
# Open RotMG code every day. Enemy drops come from running the server's own loot code.
# Any change is committed to main, which Cloudflare then deploys.
name: Update game data

on:
  schedule:
    - cron: '17 10 * * *'   # daily, 10:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-game-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download the Open RotMG repositories
        run: |
          mkdir -p .openrotmg
          for repo in Open-RotMG-Server Open-RotMG-Website Open-RotMG-Client; do
            git clone --depth 1 "https://github.com/OpenRotMG/$repo.git" ".openrotmg/$repo"
            echo "$repo: $(git -C ".openrotmg/$repo" rev-parse --short HEAD)"
          done

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .openrotmg/Open-RotMG-Server

      - name: Export enemy drops from the server's loot code
        working-directory: .openrotmg/Open-RotMG-Server
        run: |
          cat "$GITHUB_WORKSPACE/tools/codex/loot_export.rs" >> src/loot.rs
          set +e
          OPENEYE_LOOT_OUT="$GITHUB_WORKSPACE/.openrotmg/loot.json" cargo test openeye_export -- --nocapture 2>&1 | tee cargo.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] || [ ! -s "$GITHUB_WORKSPACE/.openrotmg/loot.json" ]; then
            # Surface the build or test errors as annotations, which are readable without the full log.
            # (GitHub keeps only 10 annotations per step, so it is sent as one, with %0A line breaks.)
            msg=$(grep -E -A12 '^error|panicked|FAILED' cargo.log | grep -v '^\s*Compiling' | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Loot export failed::${msg:-$(tail -40 cargo.log | sed ':a;N;$!ba;s/\n/%0A/g')}"
            exit 1
          fi

      - name: Rebuild the catalog
        run: node tools/update-catalog.mjs --from .openrotmg --loot .openrotmg/loot.json

      - name: Test
        run: npm test

      - name: Commit changes
        run: |
          git add public/catalog
          if git diff --cached --quiet; then
            echo "Game data unchanged."
            exit 0
          fi
          server=$(git -C .openrotmg/Open-RotMG-Server rev-parse --short HEAD)
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update game data from Open RotMG (server $server)"
          git push
