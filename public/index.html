<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenEye</title>
  <meta name="description" content="Player stats, rankings, graveyard and item tracker for Open RotMG.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/pixelify-sans-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" data-link aria-label="OpenEye home">
        <svg class="brand-eye" viewBox="0 0 13 9" aria-hidden="true" shape-rendering="crispEdges">
          <path fill="#ebe6d9" d="M3 1h7v1h2v1h1v3h-1v1h-2v1H3V7H1V6H0V3h1V2h2z"/>
          <path fill="#1b1e26" d="M4 2h5v1h1v3H9v1H4V6H3V3h1z"/>
          <path fill="#f2c443" d="M5 3h3v3H5z"/>
          <path fill="#1b1e26" d="M6 4h1v1H6z"/>
        </svg>
        <span>OpenEye</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="/rankings/stars" data-link data-nav="rankings">Rankings</a>
        <a href="/graveyard" data-link data-nav="graveyard">Graveyard</a>
        <a href="/legends" data-link data-nav="legends">Legends</a>
        <a href="/items" data-link data-nav="items">Items</a>
        <a href="/about" data-link data-nav="about">About</a>
      </nav>
      <form class="search" role="search" autocomplete="off">
        <label class="sr" for="search-input">Find a player</label>
        <input id="search-input" type="search" placeholder="Find a player" spellcheck="false" maxlength="20">
        <ul class="search-results" id="search-results" role="listbox" hidden></ul>
      </form>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="footer">
    <p>OpenEye is vibecoded slop made by the player Cramshon. It is not run by or associated with RedBracket or any other OpenROTMG devs. Data comes from the game's public API.</p>
    <p id="footer-status"></p>
  </footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
