<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenEye</title>
  <meta name="description" content="Player stats, rankings, graveyard and item tracker for Open RotMG.">
  <link rel="icon" href="/icons/favicon.ico?v=2" sizes="48x48">
  <link rel="icon" href="/icons/icon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#464f60">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="OpenEye">
  <meta property="og:title" content="OpenEye">
  <meta property="og:description" content="Player stats, rankings, graveyard and item tracker for Open RotMG.">
  <meta property="og:url" content="https://openrotmgeye.com/">
  <meta property="og:image" content="https://openrotmgeye.com/icons/og.png?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="/fonts/pixelify-sans-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" data-link aria-label="OpenEye home">
        <img class="brand-mark" src="/icons/logo.png?v=2" alt="" height="28">
        <span class="brand-potion" id="brand-potion" aria-hidden="true"></span>
        <span>OpenEye</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="/rankings/stars" data-link data-nav="rankings">Rankings</a>
        <a href="/graveyard" data-link data-nav="graveyard">Graveyard</a>
        <a href="/legends" data-link data-nav="legends">Legends</a>
        <a href="/loot" data-link data-nav="loot">Loot</a>
        <a href="/items" data-link data-nav="items">Items</a>
        <a href="/enemies" data-link data-nav="enemies">Enemies</a>
        <a href="/about" data-link data-nav="about">About</a>
      </nav>
      <form class="search" role="search" autocomplete="off">
        <label class="sr" for="search-input" id="search-label">Find a player</label>
        <input id="search-input" type="search" placeholder="Find a player" spellcheck="false" maxlength="40">
        <div class="search-mode" role="group" aria-label="Search for">
          <button type="button" data-search-mode="player" aria-pressed="true">Player</button>
          <button type="button" data-search-mode="codex" aria-pressed="false">Item/enemy</button>
        </div>
        <ul class="search-results" id="search-results" role="listbox" hidden></ul>
      </form>
      <div class="settings">
        <button type="button" class="cog" id="theme-button" aria-haspopup="true" aria-expanded="false" aria-controls="theme-menu" title="Theme">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M10.3 1.5h3.4l.5 2.9 1.6.7 2.4-1.7 2.4 2.4-1.7 2.4.7 1.6 2.9.5v3.4l-2.9.5-.7 1.6 1.7 2.4-2.4 2.4-2.4-1.7-1.6.7-.5 2.9h-3.4l-.5-2.9-1.6-.7-2.4 1.7-2.4-2.4 1.7-2.4-.7-1.6-2.9-.5v-3.4l2.9-.5.7-1.6-1.7-2.4 2.4-2.4 2.4 1.7 1.6-.7zM12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6z"/></svg>
          <span class="sr">Theme</span>
        </button>
        <div class="theme-menu" id="theme-menu" role="menu" aria-labelledby="theme-button" hidden></div>
      </div>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="footer">
    <p>OpenEye is vibecoded slop made by the player Cramshon. It is not run by or associated with RedBracket or any other OpenROTMG devs. Data comes from the game's public API.</p>
    <p id="footer-status"></p>
  </footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
